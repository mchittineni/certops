version: 2

updates:

# Update npm dependencies
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

# Update GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: semiannually
    commit-message:
      prefix: "chore(ci)"
